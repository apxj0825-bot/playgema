<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>السيد محمد رضا الشيرازي</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f9; padding: 20px; line-height: 1.6; }
        .card { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .profile-img { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 5px solid #2c3e50; margin-bottom: 20px; }
        h1 { color: #2c3e50; }
        .bio { font-size: 1.1em; color: #555; margin-bottom: 20px; }
        .books { text-align: right; background: #f9f9f9; padding: 15px; border-radius: 10px; }
        .books h2 { color: #e67e22; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://www.alshirazi.net/images/shirazi_reza.jpg" alt="السيد محمد رضا الشيرازي" class="profile-img">
    
    <h1>السيد محمد رضا الشيرازي</h1>
    <p class="bio">عالم دين ومفكر إسلامي، اشتهر بأسلوبه التربوي والأخلاقي المتميز وبطرحه الفكري العميق.</p>

    <div class="books">
        <h2>أبرز مؤلفاته:</h2>
        <ul>
            <li>سلسلة تدبرات في القرآن الكريم</li>
            <li>دروس في الأخلاق والتربية</li>
            <li>محاضرات في العقائد والفكر</li>
            <li>سلسلة في التفسير الموضوعي</li>
        </ul>
    </div>
</div>

</body>
</html>
